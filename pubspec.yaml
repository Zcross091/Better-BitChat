name: mesh_messenger
description: "Resilient Mesh Messenger — Multi-Transport DTN Architecture for Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.0
  provider: ^6.1.2

  # Cryptography
  cryptography: ^2.7.0
  crypto: ^3.0.3

  # Transports & Networking
  web_socket_channel: ^2.4.1
  flutter_reactive_ble: ^5.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
