name: Update Daily Quote

on:
  schedule:
    # Runs once every 24 hours at midnight (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual run from the Actions tab

jobs:
  update-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch quote and overwrite file
        run: |
          # Fetch random quote
          QUOTE_JSON=$(curl -s "https://zenquotes.io/api/random")
          
          # Parse text and author
          QUOTE=$(echo "$QUOTE_JSON" | jq -r '.[0].q')
          AUTHOR=$(echo "$QUOTE_JSON" | jq -r '.[0].a')

          # Use text.tx5 if present, otherwise default to text.txt
          if [ -f "text.tx5" ]; then
            TARGET_FILE="text.tx5"
          else
            TARGET_FILE="text.txt"
          fi

          # Overwrite file with the new quote
          echo "\"$QUOTE\" — $AUTHOR" > "$TARGET_FILE"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add text.txt text.tx5 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update quote of the day" && git push)
