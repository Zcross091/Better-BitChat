name: Build & Release Mesh Messenger App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-info:
    name: Extract Version Information
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.extract_version.outputs.app_version }}
      build_number: ${{ steps.extract_version.outputs.build_number }}
      version_tag: ${{ steps.extract_version.outputs.version_tag }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Extract Version from pubspec.yaml
        id: extract_version
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo $VERSION_LINE | cut -d'+' -f1)
          BUILD_NUM=${{ github.run_number }}
          TAG_NAME="v${VERSION_NAME}-build.${BUILD_NUM}"
          
          echo "app_version=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "version_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          
          echo "Extracted Version: ${VERSION_NAME}"
          echo "Build Number: ${BUILD_NUM}"
          echo "Version Tag: ${TAG_NAME}"

  test-and-build-android:
    name: Build Android APK
    needs: version-info
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 17 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Initialize Native Platform Wrappers
        run: flutter create . --project-name=mesh_messenger --platforms=android,ios,web --org=com.mesh.messenger

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Unit & Protocol Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --build-number=${{ needs.version-info.outputs.build_number }} --build-name=${{ needs.version-info.outputs.app_version }}

      - name: Prepare APK Output
        run: |
          mkdir -p build/release_out
          cp build/app/outputs/flutter-apk/app-release.apk build/release_out/MeshMessenger-${{ needs.version-info.outputs.version_tag }}-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshMessenger-Android-APK
          path: build/release_out/MeshMessenger-${{ needs.version-info.outputs.version_tag }}-Android.apk

  build-ios-web:
    name: Build Web & iOS Bundle
    needs: version-info
    runs-on: macos-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Initialize Native Platform Wrappers
        run: flutter create . --project-name=mesh_messenger --platforms=android,ios,web --org=com.mesh.messenger

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web App Release
        run: |
          flutter build web --release --build-number=${{ needs.version-info.outputs.build_number }} --build-name=${{ needs.version-info.outputs.app_version }}
          cd build/web && zip -r ../../MeshMessenger-${{ needs.version-info.outputs.version_tag }}-Web.zip . && cd ../..

      - name: Build iOS App Payload (No Codesign)
        run: |
          flutter build ios --release --no-codesign --build-number=${{ needs.version-info.outputs.build_number }} --build-name=${{ needs.version-info.outputs.app_version }}

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshMessenger-Web-Bundle
          path: MeshMessenger-${{ needs.version-info.outputs.version_tag }}-Web.zip

  create-github-release:
    name: Publish Versioned GitHub Release
    needs: [version-info, test-and-build-android, build-ios-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: MeshMessenger-Android-APK

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: MeshMessenger-Web-Bundle

      - name: Publish Versioned GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version-info.outputs.version_tag }}
          name: "Mesh Messenger v${{ needs.version-info.outputs.app_version }} (Build #${{ needs.version-info.outputs.build_number }})"
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Mesh Messenger Release — v${{ needs.version-info.outputs.app_version }} (Build #${{ needs.version-info.outputs.build_number }})

            ### Download & Install Apps:
            - **Android APK**: `MeshMessenger-${{ needs.version-info.outputs.version_tag }}-Android.apk` (Download and open on Android to install directly).
            - **Web App**: `MeshMessenger-${{ needs.version-info.outputs.version_tag }}-Web.zip`

            ### Architecture Features Included:
            - **DTN Bundle Architecture (RFC 9171 / BPv7)** with SHA-256 deduplication and TTL decay.
            - **Ed25519 Keypairs** and **ChaCha20-Poly1305 Payload E2E Encryption**.
            - **Multi-Transport Support**: BLE Mesh, Nostr Internet Gateway (`wss://relay.damus.io`), Sneakernet QR / File.
            - **Interactive Visual Mesh Simulator**: Real-time topology testing.
          files: |
            MeshMessenger-${{ needs.version-info.outputs.version_tag }}-Android.apk
            MeshMessenger-${{ needs.version-info.outputs.version_tag }}-Web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
